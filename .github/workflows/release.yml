# .github/workflows/release.yml
name: Release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read libVersion
        id: version
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*val[[:space:]]+libVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' build.gradle.kts | head -n1)
          if [ -z "$VERSION" ]; then
            echo "libVersion not found in build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync README version
        run: |
          V="${{ steps.version.outputs.version }}"
          case "$V" in
            *alpha*|*beta*)
              echo "Pre-release $V, skipping README update"
              exit 0
              ;;
          esac
          if ! grep -qE '^[[:space:]]*composeSturdy[[:space:]]*=' README.md; then
            echo "composeSturdy not found in README.md, skipping"
            exit 0
          fi
          if grep -qE "^[[:space:]]*composeSturdy[[:space:]]*=[[:space:]]*\"$V\"" README.md; then
            echo "README already at $V"
            exit 0
          fi
          sed -i -E "s/^([[:space:]]*composeSturdy[[:space:]]*=[[:space:]]*\")[^\"]*(\")/\1$V\2/" README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README to $V"
          git push

      - name: Check if tag exists
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          FLAGS=""
          case "$V" in *alpha*|*beta*) FLAGS="--prerelease" ;; esac
          git log -1 --pretty=%B "$GITHUB_SHA" > notes.md
          gh release create "$V" \
            --target "$(git rev-parse HEAD)" \
            --title "$V" \
            --notes-file notes.md \
            $FLAGS